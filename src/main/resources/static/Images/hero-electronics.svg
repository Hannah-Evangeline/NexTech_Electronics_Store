<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Laptop -->
  <g>
    <rect x="120" y="190" width="180" height="115" rx="8" fill="#334155"/>
    <rect x="132" y="202" width="156" height="91" rx="3" fill="#0ea5e9" opacity="0.25"/>
    <rect x="95" y="305" width="230" height="14" rx="7" fill="#475569"/>
  </g>

  <!-- Phone -->
  <g>
    <rect x="340" y="150" width="80" height="155" rx="12" fill="#334155"/>
    <rect x="349" y="165" width="62" height="118" rx="3" fill="#3b82f6" opacity="0.3"/>
    <circle cx="380" cy="293" r="4" fill="#94a3b8"/>
  </g>

  <!-- Headphones -->
  <g stroke="#60a5fa" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M440 230 a55 55 0 0 1 110 0" />
  </g>
  <rect x="430" y="225" width="24" height="40" rx="8" fill="#60a5fa"/>
  <rect x="536" y="225" width="24" height="40" rx="8" fill="#60a5fa"/>

  <!-- Smartwatch -->
  <g>
    <rect x="150" y="110" width="46" height="56" rx="10" fill="#3b82f6"/>
    <rect x="158" y="120" width="30" height="36" rx="4" fill="#0f172a"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="60" cy="70" r="4" fill="#3b82f6"/>
  <circle cx="90" cy="340" r="5" fill="#60a5fa"/>
  <circle cx="560" cy="80" r="4" fill="#3b82f6"/>
  <circle cx="520" cy="330" r="3" fill="#60a5fa"/>
</svg>
